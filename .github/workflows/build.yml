
name: Build NoAnimation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find project folder
        run: |
          SETTINGS_FILE=$(find . -type f -name settings.gradle -not -path '*/.gradle/*' -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle not found!"
            find . -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "build.gradle not found in $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Build mod
        run: |
          cd "$PROJECT_DIR"
          gradle build --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NoAnimation-JAR
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
